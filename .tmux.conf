set -g mouse on
set -g status on
set-environment -g PATH "$HOME/bin:$PATH"

# Plugins are installed under ~/.tmux/plugins by TPM.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'azorng/tmux-smooth-scroll'

# Keep snapshots in the XDG data directory used by wtmux.sh.
set -g @resurrect-dir '$HOME/.local/share/tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# WSL can stop without running shutdown hooks, so save frequently.
set -g @continuum-save-interval '5'
# wtmux.sh performs the restore with an explicit tmux socket. Keeping the
# continuum restore disabled prevents two restore jobs from racing at startup.
set -g @continuum-restore 'off'

# Keep TPM last so continuum can append its autosave hook to status-right.
run-shell '~/.tmux/plugins/tpm/tpm'
